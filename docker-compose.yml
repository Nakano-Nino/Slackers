services:
  mongodb:
    image: mongo:latest
    container_name: slackers_mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: slackers_logs
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  mongo_data:
