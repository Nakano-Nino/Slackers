services:
  # ==============================================================================
  # 1. Relational Database: PostgreSQL 16
  # ==============================================================================
  postgres:
    image: postgres:latest
    container_name: slackers_postgres_prod
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-axial}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-slackers}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-axial} -d ${POSTGRES_DB:-slackers}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - slackers_network

  # ==============================================================================
  # 2. Audit & Security Log Store: MongoDB
  # ==============================================================================
  mongodb:
    image: mongo:latest
    container_name: slackers_mongodb_prod
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-slackers_logs}
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - slackers_network

  # ==============================================================================
  # 3. Cache, Presence & Socket.IO Adapter: Redis
  # ==============================================================================
  redis:
    image: redis:latest
    container_name: slackers_redis_prod
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - slackers_network

  # ==============================================================================
  # 4. S3 Object Storage: MinIO
  # ==============================================================================
  minio:
    image: quay.io/minio/minio:latest
    container_name: slackers_minio_prod
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - slackers_network

  # Helper container: Ensure default encrypted storage bucket exists
  minio-init:
    image: quay.io/minio/mc:latest
    container_name: slackers_minio_init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      /usr/bin/mc alias set myminio http://minio:9000 $${MINIO_ROOT_USER:-minioadmin} $${MINIO_ROOT_PASSWORD};
      /usr/bin/mc mb --ignore-existing myminio/$${S3_BUCKET_NAME:-slackers-encrypted-files};
      /usr/bin/mc anonymous set download myminio/$${S3_BUCKET_NAME:-slackers-encrypted-files};
      exit 0;
      "
    networks:
      - slackers_network

  # ==============================================================================
  # 5. Backend REST & WebSocket API: Express + Prisma + Socket.IO
  # ==============================================================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: slackers_api_prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5001
      DATABASE_URL: ${DATABASE_URL}
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: ${REDIS_URL}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-slackers-encrypted-files}
      S3_FORCE_PATH_STYLE: "true"
      JWT_SECRET: ${JWT_SECRET}
      CLIENT_URL: ${APP_URL}
      SEED_DB: ${SEED_DB:-false}
    depends_on:
      postgres:
        condition: service_healthy
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - uploads_data:/app/apps/api/uploads
    networks:
      - slackers_network

  # ==============================================================================
  # 6. Frontend: Next.js 16 (App Router + React 19)
  # ==============================================================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    container_name: slackers_web_prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    depends_on:
      - api
    networks:
      - slackers_network

  # ==============================================================================
  # 7. Reverse Proxy & SSL Engine: Nginx
  # ==============================================================================
  nginx:
    image: nginx:latest
    container_name: slackers_nginx_prod
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    depends_on:
      - web
      - api
    networks:
      - slackers_network

volumes:
  postgres_data:
  mongo_data:
  redis_data:
  minio_data:
  uploads_data:
  certbot_conf:
  certbot_www:

networks:
  slackers_network:
    driver: bridge
