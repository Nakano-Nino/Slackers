services:
  # ==============================================================================
  # 1. Audit & Security Log Store: MongoDB
  # ==============================================================================
  mongodb:
    image: mongo:latest
    container_name: slackers_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-slackers_logs}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ==============================================================================
  # 2. Cache, Presence & Socket.IO Adapter: Redis
  # ==============================================================================
  redis:
    image: redis:alpine
    container_name: slackers_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  mongo_data:
    name: slackers_mongo_data
  redis_data:
    name: slackers_redis_data
