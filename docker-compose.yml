services:
  postgres:
    image: postgres:16-alpine
    container_name: slackers_postgres
    restart: always
    environment:
      POSTGRES_USER: slackers
      POSTGRES_PASSWORD: slackers_secret
      POSTGRES_DB: slackers_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U slackers -d slackers_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:latest
    container_name: slackers_mongodb
    restart: always
    environment:
      MONGO_INITDB_DATABASE: slackers_logs
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  mongo_data:
