services:
  # ==============================================================================
  # 1. Relational Database: PostgreSQL 16
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: slackers_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-slackers}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-slackers_secret}
      POSTGRES_DB: ${POSTGRES_DB:-slackers_db}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-slackers} -d ${POSTGRES_DB:-slackers_db}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # ==============================================================================
  # 2. Audit & Security Log Store: MongoDB
  # ==============================================================================
  mongodb:
    image: mongo:latest
    container_name: slackers_mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-slackers_logs}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # ==============================================================================
  # 3. Cache, Presence & Socket.IO Adapter: Redis
  # ==============================================================================
  redis:
    image: redis:alpine
    container_name: slackers_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  postgres_data:
    name: slackers_postgres_data
  mongo_data:
    name: slackers_mongo_data
  redis_data:
    name: slackers_redis_data
